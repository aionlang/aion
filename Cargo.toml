[package]
name = "aion"
version = "0.3.0"
edition = "2024"
description = "The Aion programming language compiler"
license = "MIT"
readme = "README.md"

[[bin]]
name = "aion"
path = "src/main.rs"

[dependencies]
logos = "0.16.1"
# line editing (the arrow keys, history) for `aion repl` on a terminal
rustyline = { version = "15", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
