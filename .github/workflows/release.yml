name: Release

# Builds a self-contained `aion` for each platform: the executable has the Zig C compiler embedded
# (see toolchain/zig.lock and scripts/bundle-zig.sh), so it compiles programs on a machine with no
# C compiler installed.  It runs on every push to main (to check that all platforms still build), by hand
# from the Actions tab, and on a tag such as v0.3.0, which also publishes a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: zig.lock matches ziglang.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/bundle-zig.sh --check

  build:
    name: ${{ matrix.platform }}
    needs: lock
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux,   os: ubuntu-latest }
          - { platform: aarch64-linux,  os: ubuntu-24.04-arm }
          # macOS is left out until the C runtime builds there: std_fs.c uses st_mtim, which macOS names
          # st_mtimespec.  (The platforms are in toolchain/zig.lock: x86_64-macos on macos-15-intel,
          # aarch64-macos on macos-latest.)
          - { platform: x86_64-windows, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd (Windows)
        if: runner.os == 'Windows'
        run: command -v zstd >/dev/null 2>&1 || choco install zstd --no-progress -y

      - name: Download and pack Zig
        run: scripts/bundle-zig.sh ${{ matrix.platform }}

      - name: Build aion with the Zig embedded
        run: cargo build --release --features bundled-zig

      # The runners have a C compiler, so hide it: an empty PATH and an empty cache directory leave the
      # executable only the compiler inside it.
      - name: Smoke test with no C compiler
        run: |
          set -eu
          exe=target/release/aion; [ "${{ runner.os }}" = Windows ] && exe=target/release/aion.exe
          home="$RUNNER_TEMP/aion-home"; rm -rf "$home"; mkdir -p "$home"
          if [ "${{ runner.os }}" = Windows ]; then
            run() { env -i SystemRoot="$SYSTEMROOT" TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" LOCALAPPDATA="$home" PATH=/nonexistent "$@"; }
          else
            run() { env -i HOME="$home" TMPDIR="$RUNNER_TEMP" PATH=/nonexistent "$@"; }
          fi
          # On a failure, show the message as an annotation of the run (the log needs a login to read).
          if ! run "$exe" examples/hello.aion > out.txt 2> err.txt || ! grep -q "Hello from Aion!" out.txt; then
            msg="$(head -c 3000 err.txt out.txt | awk 'BEGIN { ORS = "%0A" } { print }')"
            echo "::error title=Smoke test failed on ${{ matrix.platform }}::$msg"
            exit 1
          fi
          cat out.txt

      - name: Run the test suite on the embedded compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # SQLite, zlib and utf8proc come with Aion (vendor/) and are deliberately not installed here.
          sudo apt-get install -y libgmp-dev libexpat1 libarchive13
          AION_BUNDLED=1 cargo test --release --features bundled-zig

      - name: Package
        run: |
          set -eu
          name="aion-${{ github.ref_name }}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = Windows ]; then cp target/release/aion.exe "dist/$name/"; else cp target/release/aion "dist/$name/"; fi
          cp README.md LICENSE.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then 7z a "$name.zip" "$name" >/dev/null; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
          ls -la

      # Windows also gets a setup program (installer/aion.iss), built with Inno Setup, which the runners have.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -eu
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          case "${{ github.ref_name }}" in v[0-9]*) ver="${GITHUB_REF_NAME#v}" ;; esac
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup --no-progress -y
          "$iscc" "/DAppVersion=$ver" "/DOutName=aion-${{ github.ref_name }}-x86_64-windows-setup" installer/aion.iss
          ls -la dist

      # Install it silently, run the installed aion.exe with no other tools, uninstall it, and look at PATH each time.
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -u
          fail() { echo "::error title=Installer test failed::$1"; exit 1; }
          tmp="$(cygpath -w "$RUNNER_TEMP")"
          setup="$(ls dist/*-setup.exe)"
          inst="$tmp\\aion-installed"
          instu="$(cygpath -u "$inst")"
          user_path() { powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')"; }

          "$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=addtopath "/DIR=$inst" "/LOG=$tmp\\setup.log" || true
          for i in $(seq 1 60); do [ -f "$instu/aion.exe" ] && break; sleep 1; done
          [ -f "$instu/aion.exe" ] || fail "aion.exe was not installed: $(tail -n 8 "$RUNNER_TEMP/setup.log" 2>/dev/null | awk 'BEGIN { ORS = " | " } { print }')"
          user_path | tr ';' '\n' | grep -qxF "$inst" || fail "the install folder is not in the user PATH"

          home="$RUNNER_TEMP/aion-home-installed"; rm -rf "$home"; mkdir -p "$home"
          if ! env -i SystemRoot="$SYSTEMROOT" TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" LOCALAPPDATA="$home" PATH=/nonexistent \
               "$instu/aion.exe" examples/hello.aion > out.txt 2> err.txt || ! grep -q "Hello from Aion!" out.txt; then
            fail "the installed aion.exe failed: $(head -c 1500 err.txt | awk 'BEGIN { ORS = " | " } { print }')"
          fi

          "$instu/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART || true
          for i in $(seq 1 60); do [ -f "$instu/aion.exe" ] || break; sleep 1; done
          [ ! -f "$instu/aion.exe" ] || fail "uninstalling left aion.exe behind"
          sleep 2
          if user_path | tr ';' '\n' | grep -qxF "$inst"; then fail "uninstalling left the folder in the user PATH"; fi
          echo "installer ok"

      - uses: actions/upload-artifact@v4
        with:
          name: aion-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
